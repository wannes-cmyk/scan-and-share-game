<!doctype html>
<html lang="nl" data-theme="wannes">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Live Quiz — Doe mee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="play">

  <div class="brandbar">
    <a class="brand" href="index.html">
      <span class="brand-mark"><img src="assets/logo.webp" alt=""></span>
      <span class="brand-name" data-brand-name>AI wann.es</span>
    </a>
  </div>

  <section id="join" class="screen">
    <h1>Doe mee</h1>
    <p class="muted" id="roomlabel"></p>
    <input id="name" type="text" placeholder="Je naam" autocomplete="off" maxlength="24">
    <button id="btn-join" class="btn primary big">Doe mee</button>
    <p id="joinerror" class="error"></p>
  </section>

  <section id="wait" class="screen hidden">
    <h1 id="waittitle">Welkom</h1>
    <p class="muted">Wachten tot de host start…</p>
  </section>

  <section id="question" class="screen hidden">
    <div class="phead">
      <span id="ptimer" class="timer"></span>
    </div>
    <h2 id="pqvraag" class="question"></h2>
    <div id="popties" class="popties"></div>
    <p id="panswered" class="answered"></p>
    <div id="puitleg" class="uitleg hidden"></div>
  </section>

  <section id="end" class="screen hidden">
    <h2>Klaar!</h2>
    <canvas id="card" class="card-canvas"></canvas>
    <div class="row">
      <button id="btn-share" class="btn primary">Delen</button>
      <button id="btn-download" class="btn">Download beeld</button>
    </div>

    <div class="panel">
      <h3>De juiste antwoorden</h3>
      <div id="answers" class="answers"></div>
      <div class="row" style="margin-top:16px">
        <button id="btn-pdf" class="btn primary">Download als PDF</button>
      </div>
    </div>

    <div class="panel">
      <h3>Ook in je mailbox?</h3>
      <p class="muted small">
        Laat je e-mailadres achter, dan krijg je de antwoorden en af en toe iets over AI.
        Je kan je altijd uitschrijven.
      </p>
      <input id="lead-email" type="email" placeholder="jouw@email.be" autocomplete="email">
      <label class="consent">
        <input type="checkbox" id="lead-consent">
        <span>Ja, ik wil de antwoorden en af en toe een mail van AI wann.es.</span>
      </label>
      <button id="btn-lead" class="btn primary">Verstuur</button>
      <p id="lead-msg" class="status"></p>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script type="module" src="js/play.js"></script>
</body>
</html>
